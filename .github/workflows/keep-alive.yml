name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Peticion a /api/health
        run: |
          curl --fail --silent --show-error \
            --connect-timeout 30 --max-time 300 --retry 2 --retry-delay 15 \
            https://agendapets-api-carol.onrender.com/api/health
