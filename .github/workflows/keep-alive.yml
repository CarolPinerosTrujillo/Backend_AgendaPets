name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Peticion a /api/health
        run: |
          curl --fail --silent --show-error --max-time 120 \
            https://agendapets-api-carol.onrender.com/api/health
